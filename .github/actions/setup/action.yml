# Node and the locked dependencies (wrangler, Playwright, html-validate). Every job that runs
# repository tooling starts with this, after its own checkout.
name: Set up
description: Install Node and the locked npm dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm

    - name: Install
      shell: bash
      run: npm ci
