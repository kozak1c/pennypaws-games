# Every check a change must pass. Used by ci.yml (pull requests into staging) and by
# staging.yml (the merged tree, before it deploys), so both run exactly the same thing.
#
#   1. workflow lint (actionlint, with shellcheck on the run: blocks)
#   2. npm run check: unit tests, configuration rules, the public-file allow-list, HTML,
#      links, dry-run deploys of staging and production, and ops/health.py against a local
#      copy of the site (ops/check.mjs lists the steps)
#   3. the browser walk at 390 x 844 and 1280 x 800, light and dark, with an accessibility scan
#
# Nothing here needs a secret.
name: Site checks
description: Lint the workflows, run every check, and walk the site in a browser.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup

    # A pinned release, checked against its published SHA-256 before it runs.
    - name: Lint the workflows
      shell: bash
      env:
        ACTIONLINT_VERSION: 1.7.12
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run: |
        set -euo pipefail
        tarball="$RUNNER_TEMP/actionlint.tar.gz"
        curl -sSfL -o "$tarball" \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --quiet -
        tar -xzf "$tarball" -C "$RUNNER_TEMP" actionlint
        "$RUNNER_TEMP/actionlint" -color

    - name: Checks
      shell: bash
      run: npm run check

    - name: Install the browser
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Browser walk
      shell: bash
      run: npm run walk

    - name: Keep the screenshots
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: walk-screenshots
        path: test-results/walk/
        if-no-files-found: ignore
        retention-days: 14
